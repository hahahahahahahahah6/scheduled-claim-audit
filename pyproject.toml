[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduled-claim-audit"
version = "0.1.0"
description = "Static audit of time-triggered execution claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "scheduled-claim-audit contributors"}]
dependencies = []

[project.scripts]
scheduled-claim-audit = "scheduled_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["scheduled_claim_audit*"]
